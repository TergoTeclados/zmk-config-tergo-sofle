# dongle mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Extra ATT TX buffers so concurrent GATT discovery of both
# peripherals (plus battery CCC) does not fail with ENOMEM (ZMK #3156).
# Zephyr 4.1 / ZMK v0.4 uses CONFIG_BT_ATT_TX_COUNT instead of
# CONFIG_BT_L2CAP_TX_BUF_COUNT. ZMK already defaults this to 10 for
# split centrals; keep extra headroom for two halves plus battery CCC.
CONFIG_BT_ATT_TX_COUNT=15

# display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_BT_BAS=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
