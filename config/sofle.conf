CONFIG_ZMK_STUDIO=y

# Mouse
CONFIG_ZMK_POINTING=y

# better connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Connectivity
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Use internal RC LFCLK if the external 32 kHz crystal is faulty
# (higher power draw; only needed on the affected nice!nano)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y

# Power
CONFIG_ZMK_SLEEP=y
 # Tempo para entrar em modo de descanso em milisegundos (15 minutos)
 # 900000 = 15 minutos * 60 segundos * 1000 milisegundos
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=6000

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
